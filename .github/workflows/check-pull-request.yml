name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  workflow_dispatch:

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Depth 0 is required for SonarQube blame and new code detection

      - name: Check for real-looking CRNs and SBIs
        uses: DEFRA/fcp-sfd-core/.github/actions/check-synthetic-ids@95f58ade56b2d0dd0f15bdcba6a5f37a54bcc939 # main

      - name: Scan for secrets
        run: |
          pipx install detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security-audit

      # Also covers files outside the test container, such as .github/scripts
      - name: Lint
        run: npm run lint

      - name: Test Docker Image Build
        run: docker build --no-cache --tag fcp-sfd-bank-details .

      # The container runs as a different user, so it needs write access to the coverage mount
      - name: Run Tests
        run: |
          mkdir -p coverage
          chmod -R a+rw coverage
          npm run docker:test

      - name: Check Coverage Report
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info was not generated"
            exit 1
          fi

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
