services:
  fcp-sfd-bank-details:
    build:
      context: .
      target: development
    command: ['node', '--watch', '--inspect=0.0.0.0', './src']
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: development
      AWS_EMF_ENVIRONMENT: Local
      ENVIRONMENT: local
      JWT_AUTH_BYPASS: 'true'
    networks:
      - fcp-sfd
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json

  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: ${AWS_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    volumes:
      - floci-data:/app/data
    networks:
      - fcp-sfd

volumes:
  floci-data:

networks:
  fcp-sfd:
    driver: bridge
    name: fcp-sfd
